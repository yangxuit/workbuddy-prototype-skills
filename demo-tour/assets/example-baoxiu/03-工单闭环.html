<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>03 工单闭环</title>
<style>
  body{font-family:"Microsoft YaHei",sans-serif;background:#F2F3F5;margin:0;padding:24px}
  .wrap{max-width:820px;margin:0 auto}
  .sec{background:#FFF;border:1px solid #E5E6EB;border-radius:10px;padding:16px 20px;margin-bottom:14px}
  h3{margin:0 0 12px;font-size:15px}
  .steps{display:flex;gap:0;margin-bottom:10px;flex-wrap:wrap}
  .st{flex:1;min-width:64px;text-align:center;font-size:11.5px;padding:6px 2px;border-top:3px solid #E5E6EB;color:#86909C}
  .st.done{border-color:#00B42A;color:#00B42A}
  .st.cur{border-color:#165DFF;color:#165DFF;font-weight:700}
  .tl{border-left:2px solid #F2F3F5;padding-left:14px;margin:8px 0}
  .tl div{font-size:12.5px;color:#4E5969;padding:4px 0}
  textarea{width:100%;box-sizing:border-box;height:56px;border:1px solid #E5E6EB;border-radius:6px;padding:8px;font-size:12.5px}
  .btn{border:none;border-radius:6px;padding:8px 18px;font-size:13px;cursor:pointer;background:#165DFF;color:#FFF;margin-top:8px}
  .num{font-family:Bahnschrift,Arial}
</style>
</head>
<body>
<div class="wrap">
  <div class="sec">
    <h3>WO-1103-05 · 空压机A 紧急维修（<span id="wo-state">检修中</span>）</h3>
    <div class="steps wo-steps" id="wo-steps"></div>
    <div class="tl" id="wo-tl"></div>
    <div id="op-area"></div>
  </div>
</div>
<script src="_shared/mock.js"></script>
<script src="_shared/tour.js"></script>
<script>
var NAMES = ['派单', '接单', '检修', '提交', '验收', '签名', '归档'];
var t = DB.tickets[0];
var ST = { step: t.step, signed: false };
function render() {
  document.getElementById('wo-steps').innerHTML = NAMES.map(function (n, i) {
    var cls = i < ST.step ? 'done' : (i === ST.step ? 'cur' : '');
    return '<div class="st ' + cls + '">' + (i < ST.step ? '✓ ' : '') + n + '</div>';
  }).join('');
  document.getElementById('wo-tl').innerHTML = t.steps.slice(0, ST.step).map(function (s) {
    return '<div><b>' + s.t + '</b> ' + s.n + ' · ' + s.by + (s.note ? '（' + s.note + '）' : '') + '</div>';
  }).join('') + (ST.signed ? '<div><b>10:05</b> 签名归档 · 张总工（SIG-1103-088）</div>' : '');
  var area = document.getElementById('op-area');
  if (ST.step === 3) {
    area.innerHTML = '<textarea id="op-note" placeholder="检修记录（必填）"></textarea>' +
      '<button class="btn" data-op="submit" onclick="doSubmit()">提交检修记录</button>';
  } else if (ST.step === 4) {
    area.innerHTML = '<div style="font-size:12.5px;color:#FF7D00">系统复测中…（3s）</div>';
    if (!ST.retesting) { ST.retesting = true; setTimeout(function () { ST.step = 5; render(); }, 3000); }
  } else if (ST.step === 5) {
    area.innerHTML = '<input id="op-pwd" placeholder="签名口令" style="padding:7px;border:1px solid #E5E6EB;border-radius:6px;margin-right:8px">' +
      '<button class="btn" data-op="sign" onclick="doSign()">数字签名并归档</button>';
  } else if (ST.step >= 6) {
    area.innerHTML = '<div style="color:#00B42A;font-size:13px">✓ 已签名归档 · 证书 SIG-1103-088 · 红警 AL-1103-006 自动消音</div>';
  } else { area.innerHTML = ''; }
}
function doSubmit() {
  var v = document.getElementById('op-note').value.trim();
  if (!v) { document.getElementById('op-note').style.borderColor = '#F53F3F'; return; }
  ST.step = 4; t.steps.push({ n: '提交', t: '10:01', by: '王建国', note: v }); render();
}
function doSign() {
  var v = document.getElementById('op-pwd').value.trim();
  if (!v) { document.getElementById('op-pwd').style.borderColor = '#F53F3F'; return; }
  ST.step = 6; ST.signed = true; document.getElementById('wo-state').textContent = '已归档'; render();
}
render();
if (location.hash.match(/#\/tour@/)) setTimeout(CMP.resumeTour, 300);
</script>
</body>
</html>
